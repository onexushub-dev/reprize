# Supabase project settings for the Reprize backend (sharing design: docs/superpowers/specs/2026-11-16-recording-sharing-design.md).
project_id = "reprize"

# Spike 1 (background upload): signs PUT/HEAD URLs for the dev R2 bucket. Not a product endpoint.
# The publishable key is not a JWT, so the gateway check is off and the function checks its own spike key.
[functions.spike-sign]
verify_jwt = false

# Called by pg_cron every 10 minutes with the x-cron-key header (sharing migration); no user JWT.
[functions.expire-shares]
verify_jwt = false

# Called by the app with the user's access token; the function checks it itself (the publishable key is not a JWT).
[functions.delete-account]
verify_jwt = false

# Called by the app with the user's access token (checked inside, like delete-account).
[functions.create-share]
verify_jwt = false

# Called by the app's upload queue with the user's access token (checked inside).
[functions.confirm-upload]
verify_jwt = false

# Called by the app with the user's access token (checked inside): Desligar link.
[functions.share-off]
verify_jwt = false

# Public: the link page asks it what a code shows (the code is the secret).
[functions.share-page]
verify_jwt = false

# The app opens a shared link (access token optional, checked inside).
[functions.open-share]
verify_jwt = false

# TEMP(dev-reset): dev only, checks its own x-reset-key and refuses unless DEV_RESET=on (see supabase/scripts/reset-sharing.sh).
[functions.dev-reset]
verify_jwt = false

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.replaycamera'
version = '0.1.0'

android {
  namespace "expo.modules.replaycamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // FocusBench (androidTest): Modo Foco speed on other phones, through Firebase Test Lab
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  lintOptions {
    abortOnError false
  }
  // The Swift core's fixtures (Seguir a Bola parity), read in place so there is one copy.
  sourceSets { test { resources.srcDirs += ['../ios/Core/Tests/ReplayCoreTests/Fixtures'] } }
}

dependencies {
  implementation 'com.google.mlkit:pose-detection:18.0.0-beta5'
  implementation 'androidx.media3:media3-transformer:1.9.1'
  implementation 'androidx.media3:media3-effect:1.9.1'
  implementation 'androidx.media3:media3-common:1.9.1'
  // Voice command ("salvar"/"save"): on-device speech, fed with the recorder's own audio. Alpha API.
  implementation 'com.google.mlkit:genai-speech-recognition:1.0.0-alpha2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
  // Sharing: uploads and downloads that go on in the background and after the app is swiped away.
  implementation 'androidx.work:work-runtime-ktx:2.10.1'
  // The pairing QR (camera phone side).
  implementation 'com.google.zxing:core:3.5.3'
  // The notice of a new version: asks Google Play whether this phone has an update.
  implementation 'com.google.android.play:app-update:2.1.0'
  // Seguir a Bola: the ball models (assets/ball_tiny_*.tflite) on the GPU, the CPU when the GPU cannot run them.
  implementation 'com.google.ai.edge.litert:litert:1.4.2'
  implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
  implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'
  testImplementation 'junit:junit:4.13.2'
  // org.json is a stub in JVM unit tests; the real one reads the remote protocol's JSON there.
  testImplementation 'org.json:json:20240303'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

// ML Kit GenAI speech is built with a newer Kotlin (metadata 2.4) than the app's compiler; its API is plain classes
// and flows, so the version check is skipped for this module only.
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  compilerOptions.freeCompilerArgs.add("-Xskip-metadata-version-check")
}
